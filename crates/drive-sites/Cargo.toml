[package]
name = "drive-sites"
description = "Drive's static sites: a folder of Markdown (Obsidian-style wikis included) in the space's file tree, a theme and its overrides, turned into a dodeca project, built with `ddc`, and published to the node and to public storage"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
drive-files = { path = "../drive-files" }
drive-graph.workspace = true
loro.workspace = true
serde.workspace = true
serde_json.workspace = true
blake3 = "1"
opendal = { version = "0.59", default-features = false }
regex = "1"
serde_yaml_ng = "0.10"
toml = "0.9"
tokio = { version = "1", features = ["process", "fs", "rt", "macros", "time"] }
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tempfile = "3"
