[package]
name = "drive-transfer"
description = "Drive's bulk bytes between devices: an iroh endpoint per device, files served read-only in place as BLAKE3-verified blobs (iroh-blobs), and byte ranges fetched and streamed, resumably"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# No metrics (unused) and one TLS backend, aws-lc-rs, as rustls uses here
# elsewhere: the default ring would be a second (drive#36).
iroh = { version = "1.5", default-features = false, features = ["portmapper", "fast-apple-datapath", "tls-aws-lc-rs"] }
iroh-blobs = { version = "0.105", default-features = false, features = ["fs-store"] }
bao-tree = { version = "0.17", default-features = false }
bytes = "1"
futures = "0.3"
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
drive-local = { path = "../drive-local" }

[dev-dependencies]
tempfile = "3"
