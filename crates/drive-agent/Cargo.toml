[package]
name = "drive-agent"
description = "Drive's agent: registers this device and its storage, keeps its cache, and shows the space's files to the operating system (a FUSE mount on Linux) with their sync state"
version.workspace = true
edition.workspace = true
license.workspace = true

# The program is `drive` (`drive serve`, `drive mount`, `drive mcp`, …);
# the crate keeps its name, and its state folder stays `drive-agent`.
[[bin]]
name = "drive"
path = "src/main.rs"

[dependencies]
drive-native = { path = "../drive-native" }
drive-files = { path = "../drive-files" }
drive-sites = { path = "../drive-sites" }
drive-graph = { workspace = true, features = ["share"] }
drive-sidecars = { workspace = true, features = ["produce"] }
opendal = { version = "0.59", default-features = false }
drive-spine.workspace = true
drive-rules.workspace = true
blake3 = "1"
getrandom = "0.3"
loro.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
fuser = { version = "0.19", optional = true }
libc = "0.2"
sysinfo = { version = "0.40", default-features = false, features = ["disk"] }
notify = "9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Traces to an OTLP collector, when OTEL_EXPORTER_OTLP_ENDPOINT (or
# _TRACES_ENDPOINT) is set; nothing is exported otherwise.
opentelemetry = "0.30"
opentelemetry_sdk = { version = "0.30", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.30", default-features = false, features = ["http-proto", "reqwest-blocking-client", "reqwest-rustls-webpki-roots", "trace"] }
tracing-opentelemetry = "0.31"
drive-proto = { path = "../drive-proto" }
drive-transfer = { path = "../drive-transfer" }
drive-kache = { path = "../drive-kache" }
drive-local = { path = "../drive-local" }
# No metrics (unused) and one TLS backend, aws-lc-rs, as rustls uses here
# elsewhere: the default ring would be a second (drive#36).
iroh = { version = "1.5", default-features = false, features = ["portmapper", "fast-apple-datapath", "tls-aws-lc-rs"] }
futures = "0.3"
# Location indexes on disk (index_db.rs), the same engine as the node.
# Pinned to the version tested under several processes (drive#157):
# indexes.db is opened with experimental_multiprocess_wal, which a
# turso release may change. The flag is still needed when no agent runs
# (`drive` commands then open the database themselves, two at once
# possibly); beside a running agent they ask it over app.sock instead.
turso = "=0.8.4"

[dev-dependencies]
tempfile = "3"
# The macOS extension's bridge, driven against this agent end to end.
drive-fileprovider = { path = "../drive-fileprovider" }
# The MCP server's tests run a node in the same process.
drive-node = { path = "../drive-node" }
axum = "0.8"

[features]
# The FUSE mount (Linux: libfuse3; macOS: macFUSE). `serve` needs none of it.
default = ["mount", "clip"]
mount = ["dep:fuser"]
# Images found by what they show (CLIP, docs/graph.md): built in, used only
# where its model has been fetched (`drive graph model fetch --clip`).
clip = ["drive-graph/clip"]
