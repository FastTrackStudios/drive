[package]
name = "drive-agent"
description = "Drive's agent: registers this device and its storage, keeps its cache, and shows the space's files to the operating system (a FUSE mount on Linux) with their sync state"
version.workspace = true
edition.workspace = true
license.workspace = true

# The program is `drive` (`drive serve`, `drive mount`, `drive mcp`, …);
# the crate keeps its name, and its state folder stays `drive-agent`.
[[bin]]
name = "drive"
path = "src/main.rs"

[dependencies]
drive-native = { path = "../drive-native" }
drive-files = { path = "../drive-files" }
drive-sites = { path = "../drive-sites" }
drive-sidecars = { workspace = true, features = ["produce"] }
opendal = { version = "0.59", default-features = false }
drive-spine.workspace = true
drive-rules.workspace = true
blake3 = "1"
getrandom = "0.3"
loro.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
fuser = { version = "0.19", optional = true }
libc = "0.2"
sysinfo = { version = "0.40", default-features = false, features = ["disk"] }
notify = "9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Traces to an OTLP collector, when OTEL_EXPORTER_OTLP_ENDPOINT (or
# _TRACES_ENDPOINT) is set; nothing is exported otherwise.
opentelemetry = "0.30"
opentelemetry_sdk = { version = "0.30", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.30", default-features = false, features = ["http-proto", "reqwest-blocking-client", "reqwest-rustls-webpki-roots", "trace"] }
tracing-opentelemetry = "0.31"
drive-proto = { path = "../drive-proto" }
drive-transfer = { path = "../drive-transfer" }
drive-kache = { path = "../drive-kache" }
drive-local = { path = "../drive-local" }
iroh = "1"
futures = "0.3"

[dev-dependencies]
tempfile = "3"
# The MCP server's tests run a node in the same process.
drive-node = { path = "../drive-node" }
axum = "0.8"

[features]
# The FUSE mount (Linux: libfuse3; macOS: macFUSE). `serve` needs none of it.
default = ["mount"]
mount = ["dep:fuser"]
