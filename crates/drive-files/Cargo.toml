[package]
name = "drive-files"
description = "Drive's files: the file tree (a Loro tree), content-addressed blobs over OpenDAL, BLAKE3 hashing, and the space's registry of devices and storage"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
loro.workspace = true
serde.workspace = true
serde_json.workspace = true
blake3 = "1"
getrandom = "0.3"
opendal = { version = "0.59", features = ["services-fs", "services-memory", "services-s3", "services-webdav"], optional = true }
bytes = "1"
thiserror = "2"
ignore = { version = "0.4", optional = true }
postcard = { workspace = true, optional = true }
zstd = { version = "0.14", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
getrandom = { version = "0.3", features = ["wasm_js"] }

[features]
# The blob store and storage configs (OpenDAL); without it, the tree, the
# registry and hashing (what a browser needs).
default = ["storage"]
storage = ["dep:opendal", "dep:ignore", "dep:postcard", "dep:zstd"]

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tempfile = "3"
