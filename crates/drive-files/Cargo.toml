[package]
name = "drive-files"
description = "Drive's files: the file tree (a Loro tree), content-addressed blobs over OpenDAL, BLAKE3 hashing, and the space's registry of devices and storage"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
loro.workspace = true
serde.workspace = true
serde_json.workspace = true
blake3 = "1"
opendal = { version = "0.59", features = ["services-fs", "services-memory", "services-s3", "services-webdav"], optional = true }
bytes = "1"
thiserror = "2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"

[features]
# The blob store and storage configs (OpenDAL); without it, the tree, the
# registry and hashing (what a browser needs).
default = ["storage"]
storage = ["dep:opendal"]

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tempfile = "3"
