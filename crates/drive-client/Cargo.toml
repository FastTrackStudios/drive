[package]
name = "drive-client"
description = "What an app embeds to use Drive: documents that sync live and work offline, and presence, in a browser or a native app"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# This device as a peer: documents sync with the account's other devices
# over iroh, with no node (drive-sync, drive-net). Native only.
p2p = ["dep:drive-sync", "dep:drive-net"]

[dependencies]
drive-proto.workspace = true
drive-spine.workspace = true
loro.workspace = true
serde.workspace = true
serde_json.workspace = true
futures-channel = "0.3"
tracing = "0.1"

# In a browser: the page's WebSocket, timers, localStorage and IndexedDB.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
gloo-timers = { version = "0.3", features = ["futures"] }
web-sys = { version = "0.3", features = ["WebSocket", "MessageEvent", "BinaryType", "CloseEvent", "Event", "Window", "Document", "VisibilityState", "Storage", "Location", "IdbFactory", "IdbDatabase", "IdbOpenDbRequest", "IdbRequest", "IdbObjectStore", "IdbTransaction", "IdbTransactionMode", "DomStringList"] }
getrandom = { version = "0.3", features = ["wasm_js"] }
getrandom02 = { package = "getrandom", version = "0.2", features = ["js"] }

# In a native app (a desktop or phone build): a WebSocket on Tokio and a
# folder for the copies, named as drive-native names them.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
drive-native = { path = "../drive-native" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs"] }
futures-util = { version = "0.3", features = ["sink"] }
getrandom = "0.3"
libc = "0.2"
drive-sync = { path = "../drive-sync", features = ["iroh"], optional = true }
drive-net = { path = "../drive-net", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
drive-node = { path = "../drive-node" }
axum = "0.8"
tempfile = "3"
tracing-subscriber = "0.3"
