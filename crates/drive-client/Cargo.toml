[package]
name = "drive-client"
description = "What an app embeds to use Drive: documents that sync live and work offline, and presence"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
drive-proto.workspace = true
drive-spine.workspace = true
loro.workspace = true
serde.workspace = true
serde_json.workspace = true
futures-channel = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
gloo-timers = { version = "0.3", features = ["futures"] }
web-sys = { version = "0.3", features = ["WebSocket", "MessageEvent", "BinaryType", "CloseEvent", "Event", "Window", "Storage", "Location", "IdbFactory", "IdbDatabase", "IdbOpenDbRequest", "IdbRequest", "IdbObjectStore", "IdbTransaction", "IdbTransactionMode", "DomStringList"] }
getrandom = { version = "0.3", features = ["wasm_js"] }
getrandom02 = { package = "getrandom", version = "0.2", features = ["js"] }
