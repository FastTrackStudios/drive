[package]
name = "drive-dioxus"
description = "Drive for Dioxus apps: live documents and presence as signals, and the shared pieces (avatars, status, cursors), in a browser or a native app"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Sync this app's documents peer to peer, with no node
# (`drive_dioxus::peer_to_peer`). Native only.
p2p = ["drive-client/p2p"]

[dependencies]
tracing = "0.1"
drive-client.workspace = true
drive-proto.workspace = true
drive-spine.workspace = true
dioxus.workspace = true
serde.workspace = true
serde_json.workspace = true
futures-util = "0.3"
sha2 = "0.10"

# In a browser: the page's storage, location, cookies and fetch.
[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Location", "Storage", "Response", "Request", "RequestInit", "Headers", "Document", "HtmlDocument"] }

# Natively (a desktop or phone build): HTTP to the node, randomness.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
# A call's span sent along as its W3C traceparent, so the node's spans join
# the app's trace.
opentelemetry = "0.30"
opentelemetry_sdk = "0.30"
tracing-opentelemetry = "0.31"
getrandom = "0.3"
