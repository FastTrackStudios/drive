[package]
name = "drive-local"
description = "Apps get any Drive file as a real local path at disk speed, wherever it lives: a small blocking client of the running Drive agent's local app API (a Unix socket in its folder, or a loopback port), with leases, warming and change notices (docs/app-files.md)"
version.workspace = true
edition.workspace = true
license.workspace = true

# Light on purpose: apps (an audio engine) link it. std, serde, serde_json;
# no async runtime, no network stack beyond the loopback.
[dependencies]
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
tempfile = "3"
