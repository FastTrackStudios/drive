[package]
name = "drive-node"
description = "Drive's node: an always-on peer that keeps documents, relays live edits and presence, and serves apps"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
drive-proto.workspace = true
drive-files = { path = "../drive-files" }
drive-spine.workspace = true
zip = { version = "5", default-features = false }
zstd = "0.14"
loro.workspace = true
serde.workspace = true
serde_json.workspace = true
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.7", features = ["fs", "trace"] }
turso = "0.8"
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
