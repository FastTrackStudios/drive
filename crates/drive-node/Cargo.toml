[package]
name = "drive-node"
description = "Drive's node: an always-on peer that keeps documents, relays live edits and presence, and serves apps"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
drive-proto.workspace = true
drive-files = { path = "../drive-files" }
drive-transfer = { path = "../drive-transfer" }
drive-spine.workspace = true
drive-rules.workspace = true
drive-view = { workspace = true, features = ["edit"] }
drive-sidecars = { workspace = true, features = ["produce"] }
zip = { version = "5", default-features = false }
zstd = "0.14"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
blake3 = "1"
loro.workspace = true
serde.workspace = true
serde_json.workspace = true
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.7", features = ["fs", "trace"] }
# Traces to an OTLP collector when OTEL_EXPORTER_OTLP_ENDPOINT (or
# _TRACES_ENDPOINT) is set, joined to a caller's trace by its traceparent.
opentelemetry = "0.30"
opentelemetry_sdk = { version = "0.30", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.30", default-features = false, features = ["http-proto", "reqwest-blocking-client", "reqwest-rustls-webpki-roots", "trace"] }
tracing-opentelemetry = "0.31"
turso = "0.8"
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
