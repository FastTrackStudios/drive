[package]
name = "drive-graph"
description = "Drive's graph: Markdown links, tags and app links across a space, worked out by every peer from data that already syncs (a projection, never edited)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
regex = "1"
serde_yaml_ng = "0.10"
drive-spine.workspace = true
drive-files = { path = "../drive-files", default-features = false }
serde.workspace = true
serde_json.workspace = true
blake3 = "1"
# The index in a peer's local database (every native peer); without it,
# the in-memory index only (a browser).
turso = { version = "0.8", optional = true }
tokio = { version = "1", features = ["sync", "time"], optional = true }

# Vectors (embed.rs): a Model2Vec static model, pure Rust everywhere
# (the tokenizer's regexes in fancy-regex, not oniguruma's C).
tokenizers = { version = "0.22", default-features = false, features = ["fancy-regex"], optional = true }
safetensors = { version = "0.7", optional = true }
half = { version = "2", optional = true }

# Images by what they show (clip.rs): CLIP through candle, on the
# machines that build with `clip`.
candle-core = { version = "0.9.2", optional = true }
candle-nn = { version = "0.9.2", optional = true }
candle-transformers = { version = "0.9.2", optional = true }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp"], optional = true }

# Handing derived data to other peers (share.rs) over a device's iroh
# endpoint.
iroh = { version = "1.5", default-features = false, features = ["portmapper", "fast-apple-datapath", "tls-aws-lc-rs"], optional = true }

[dev-dependencies]
drive-net = { path = "../drive-net" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
iroh = { version = "1.5", default-features = false, features = ["portmapper", "fast-apple-datapath", "tls-aws-lc-rs"] }
loro.workspace = true

[features]
default = ["turso", "embed"]
turso = ["dep:turso", "dep:tokio"]
embed = ["dep:tokenizers", "dep:safetensors", "dep:half"]
share = ["turso", "embed", "dep:iroh"]
clip = ["embed", "dep:candle-core", "dep:candle-nn", "dep:candle-transformers", "dep:image"]
