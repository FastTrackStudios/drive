[package]
name = "drive-app"
description = "The Drive app: the inbox, the calendar, notes and everything every app keeps"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
dioxus.workspace = true
drive-dioxus.workspace = true
drive-spine.workspace = true
drive-view = { workspace = true, features = ["ui", "pdf"] }
drive-sidecars.workspace = true
drive-files = { path = "../../crates/drive-files", default-features = false }
gloo-net = { version = "0.8", default-features = false, features = ["http"] }
serde_json.workspace = true
loro.workspace = true
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Storage"] }
serde.workspace = true
# The window: sidebar, top bar, tabs once a second one opens (main, 2026-11-21).
app-shell = { git = "https://github.com/FastTrackStudios/app-shell", tag = "v0.2.0" }

[features]
default = []
web = ["dioxus/web"]
