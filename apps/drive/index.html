<!DOCTYPE html>
<html>
    <head>
        <title></title>
        <meta content="text/html;charset=utf-8" http-equiv="Content-Type">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta charset="UTF-8">
        <style>
            /* Shown until the app draws into #main. */
            #boot-loading { position: fixed; inset: 0; display: grid; place-items: center; background: #000; color: #a1a1aa; font: 15px -apple-system, system-ui, sans-serif; }
            #main:not(:empty) ~ #boot-loading { display: none; }
        </style>
    </head>
    <body>
        <div id="main"></div>
        <div id="boot-loading">Loading Drive…</div>
    </body>
</html>
