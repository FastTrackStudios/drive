# Release: the only workflow. Nothing runs on a push or a pull request;
# development checks are local (`just ci`). Two ways in:
#
#   push of a v* tag     `just release` (docs/release.md): the full checks,
#                        then, only if every one passes, the binaries and
#                        the GitHub Release. A tag whose checks fail gets no
#                        Release; fix forward and tag the next version (a
#                        tag is never moved or reused).
#   workflow_dispatch    `just ci-remote <branch>`: the same checks on any
#                        branch, nothing published.
#
# Every job runs on THEBATTLESHIP (`thebattleship` for checks,
# `thebattleship-release` for the release build), whose job gate accepts a
# public repo's v* tags and dispatches only. kache is each runner's
# RUSTC_WRAPPER and the dev shell's rustc is the same store path as a local
# `devenv shell`, so crates built on this machine are not built again.
# The checks build the tag's commit unstamped, exactly as a local build of
# it, for that reason; only the release build stamps the version.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: devenv shell -- bash -e {0}

jobs:
  tests:
    name: Tests
    runs-on: [self-hosted, thebattleship]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/battleship
        with:
          kind: tests
      - run: just ci-tests

  lint:
    name: Clippy
    runs-on: [self-hosted, thebattleship]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/battleship
        with:
          kind: lint
      - run: just ci-lint

  wasm:
    name: Browser build
    runs-on: [self-hosted, thebattleship]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/battleship
        with:
          kind: wasm
      - run: just ci-wasm

  dist:
    name: Binaries
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    needs: [tests, lint, wasm]
    runs-on: [self-hosted, thebattleship-release]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/battleship
        with:
          kind: dist
      # Releases commit no version: the tag's goes into this checkout.
      - name: Stamp
        run: bash scripts/release.sh stamp "${GITHUB_REF_NAME#v}"
      - name: Guard
        run: bash scripts/release.sh guard
      - run: just dist dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist-linux
          path: dist/*.tar.gz
          retention-days: 7

  dist-macos:
    name: Binaries (macOS)
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    needs: [tests, lint, wasm]
    # airlock, the M4 Mac mini: Apple silicon natively, Intel (the Mac Pro)
    # cross-compiled; the agent without the FUSE mount (docs/fileprovider.md).
    runs-on: [self-hosted, airlock]
    timeout-minutes: 90
    defaults:
      run:
        shell: bash -e {0}
    env:
      CARGO_TARGET_DIR: /Volumes/build-disk/development/targets/drive-release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Stamp
        run: bash scripts/release.sh stamp "${GITHUB_REF_NAME#v}"
      - name: Guard
        run: bash scripts/release.sh guard
      - name: Build
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          bash scripts/dist.sh aarch64-apple-darwin dist
          bash scripts/dist.sh x86_64-apple-darwin dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist-macos
          path: dist/*.tar.gz
          retention-days: 7

  nix:
    name: Nix packages to Cachix (${{ matrix.system }})
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    needs: [tests, lint, wasm]
    # The packages machines install (`github:FastTrackStudios/drive/<tag>`),
    # built exactly as a machine evaluates them: from the tag on GitHub,
    # unstamped (a stamped tree would be another store path, and every
    # machine would miss the cache and build it again). Pushed to
    # fasttrackstudio.cachix.org, which every fleet machine trusts.
    #
    # Linux only. The Macs install the release's own macOS tarballs through
    # Nix instead (a fetchurl package in the fleet config, pinned to the
    # tarball's SHA-256): airlock's internal disk, where its Nix store is,
    # cannot hold this build (over 2,000 derivations; 1.5 GB free,
    # 2026-11-24), and the Mac Pro would build another store path anyway
    # (its own darwin nixpkgs).
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: [self-hosted, thebattleship-release]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash -e {0}
    steps:
      - name: Build and push
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          export PATH="/nix/var/nix/profiles/default/bin:/run/current-system/sw/bin:$PATH"
          ref="github:FastTrackStudios/drive/$GITHUB_REF_NAME"
          paths=$(nix build --no-link --print-out-paths "$ref#drive" "$ref#drive-node")
          echo "$paths"
          # cachix from the nixpkgs Drive's flake pins.
          nix run github:NixOS/nixpkgs/8ce4ef6cb6f871616146b9fe26d2a5ae594e94fe#cachix -- \
            push fasttrackstudio $paths

  publish:
    name: GitHub Release
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    needs: [dist, dist-macos, nix]
    runs-on: [self-hosted, thebattleship-release]
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/battleship
        with:
          kind: publish
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum ./*.tar.gz > SHA256SUMS && cat SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The tag's annotation (its notes) is not fetched by a plain checkout.
          git fetch -f origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          bash scripts/release.sh publish dist
