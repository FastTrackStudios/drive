# A THEBATTLESHIP runner (self-hosted NixOS, ~/.flake
# hosts/THEBATTLESHIP/github-runners.nix) for one build kind: the pinned
# devenv on PATH, the repo's dev shell evaluated once, and cargo pointed at
# this kind's target dir in the repo's cache.
#
# Nothing is restored: kache (the RUSTC_WRAPPER every runner unit has)
# serves every crate already built here, by CI or by a local build in the
# same dev shell, because the dev shell's rustc is the same store path.
# So this build's rustflags must stay in .cargo/config.toml, never in the
# workflow's env: a RUSTFLAGS here would change every crate's kache key.
name: THEBATTLESHIP dev shell + target dir
description: Put devenv 2.4.0 on PATH, check the dev shell and point CARGO_TARGET_DIR at the kind's dir.
inputs:
  kind:
    description: Build kind (tests, lint, wasm, dist); names the target dir.
    required: true
  max-gb:
    description: Start the target dir over past this size (kache refills it).
    required: false
    default: "80"
runs:
  using: composite
  steps:
    - name: devenv
      shell: bash
      run: |
        set -euo pipefail
        if ! command -v devenv >/dev/null; then
          out=$(nix build --no-link --print-out-paths \
            github:NixOS/nixpkgs/e62746b0b472753ef019baceab6f1e2e52014980#devenv)
          echo "$out/bin" >> "$GITHUB_PATH"
          export PATH="$out/bin:$PATH"
        fi
        v="$(devenv version | awk '{print $2}')"
        [ "$v" = 2.4.0 ] || { echo "::error::devenv $v on this runner; this repo pins 2.4.0"; exit 1; }
        echo "devenv $v: $(command -v devenv)"
    - name: target dir
      shell: bash
      env:
        KIND: ${{ inputs.kind }}
        MAX_GB: ${{ inputs.max-gb }}
      run: |
        set -euo pipefail
        [ -n "${CI_CACHE_DIR:-}" ] || { echo "::error::no CI_CACHE_DIR: not a THEBATTLESHIP runner"; exit 1; }
        dir="$CI_CACHE_DIR/$KIND/$RUNNER_NAME/target"
        mkdir -p "$dir"
        gb="$(du -s --block-size=1G "$dir" | cut -f1)"
        if [ "$gb" -gt "$MAX_GB" ]; then
          echo "::warning::$dir is ${gb} GB (cap ${MAX_GB}): starting over"
          rm -rf "$dir" && mkdir -p "$dir"
        fi
        echo "CARGO_TARGET_DIR=$dir" >> "$GITHUB_ENV"
        echo "$KIND: $dir; wrapper ${RUSTC_WRAPPER:-none}"
    - name: dev shell
      shell: devenv shell -- bash -e {0}
      run: fleet-doctor
