[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[workspace.dependencies]
drive-proto = { path = "crates/drive-proto" }
drive-client = { path = "crates/drive-client" }
drive-dioxus = { path = "crates/drive-dioxus" }
drive-spine = { path = "crates/drive-spine" }
drive-view = { path = "crates/drive-view", default-features = false }
drive-sidecars = { path = "crates/drive-sidecars" }
drive-rules = { path = "crates/drive-rules" }
drive-graph = { path = "crates/drive-graph" }
loro = "1.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
postcard = { version = "1", features = ["use-std"] }
dioxus = { version = "=0.8.0-alpha.3", features = ["router"] }

# The native apps' renderer, fast even in a dev build: Blitz's style,
# layout and paint, Vello on wgpu and the text stack at full optimisation
# (the app's own code stays quick to rebuild). The set Studio uses.
[profile.dev.package.blitz-dom]
opt-level = 3
[profile.dev.package.blitz-paint]
opt-level = 3
[profile.dev.package.blitz-shell]
opt-level = 3
[profile.dev.package.blitz-traits]
opt-level = 3
[profile.dev.package.blitz-html]
opt-level = 3
[profile.dev.package.anyrender]
opt-level = 3
[profile.dev.package.anyrender_vello]
opt-level = 3
[profile.dev.package.anyrender_vello_hybrid]
opt-level = 3
[profile.dev.package.vello]
opt-level = 3
[profile.dev.package.vello_encoding]
opt-level = 3
[profile.dev.package.vello_hybrid]
opt-level = 3
[profile.dev.package.wgpu]
opt-level = 3
[profile.dev.package.wgpu-core]
opt-level = 3
[profile.dev.package.wgpu-hal]
opt-level = 3
[profile.dev.package.naga]
opt-level = 3
[profile.dev.package.stylo]
opt-level = 3
[profile.dev.package.selectors]
opt-level = 3
[profile.dev.package.taffy]
opt-level = 3
[profile.dev.package.parley]
opt-level = 3
[profile.dev.package.skrifa]
opt-level = 3
[profile.dev.package.read-fonts]
opt-level = 3
[profile.dev.package.swash]
opt-level = 3
[profile.dev.package.fontique]
opt-level = 3
[profile.dev.package.peniko]
opt-level = 3
[profile.dev.package.kurbo]
opt-level = 3
[profile.dev.package.dioxus-core]
opt-level = 3
[profile.dev.package.dioxus-native-dom]
opt-level = 3

# The native apps' one dev build (dx build --profile desktop-dev), as Studio
# names it: dev, with the renderer at full optimisation (above).
[profile.desktop-dev]
inherits = "dev"

[profile.wasm-dev]
inherits = "dev"
opt-level = 1

[profile.server-dev]
inherits = "dev"

[profile.android-dev]
inherits = "dev"

# pdfcraft (drive-view's PDFs) builds against its own vendored copies of
# hayro, lopdf and vello (crates-io patches in its workspace, which a
# dependent does not inherit): the same ones, from the same revision.
[patch.crates-io]
hayro = { git = "https://github.com/storytold/pdfcraft", rev = "b503b2e62dfeec5598f344e4e287d9c9cbdb34fa" }
hayro-interpret = { git = "https://github.com/storytold/pdfcraft", rev = "b503b2e62dfeec5598f344e4e287d9c9cbdb34fa" }
hayro-syntax = { git = "https://github.com/storytold/pdfcraft", rev = "b503b2e62dfeec5598f344e4e287d9c9cbdb34fa" }
hayro-cmap = { git = "https://github.com/storytold/pdfcraft", rev = "b503b2e62dfeec5598f344e4e287d9c9cbdb34fa" }
hayro-postscript = { git = "https://github.com/storytold/pdfcraft", rev = "b503b2e62dfeec5598f344e4e287d9c9cbdb34fa" }
hayro-jbig2 = { git = "https://github.com/storytold/pdfcraft", rev = "b503b2e62dfeec5598f344e4e287d9c9cbdb34fa" }
lopdf = { git = "https://github.com/storytold/pdfcraft", rev = "b503b2e62dfeec5598f344e4e287d9c9cbdb34fa" }
vello_common = { git = "https://github.com/storytold/pdfcraft", rev = "b503b2e62dfeec5598f344e4e287d9c9cbdb34fa" }
vello_cpu = { git = "https://github.com/storytold/pdfcraft", rev = "b503b2e62dfeec5598f344e4e287d9c9cbdb34fa" }

# The web apps' release build (dx builds web releases with this profile):
# the WASM is the whole download, so it is built for size, as one unit
# (and then through wasm-opt, apps/drive/Dioxus.toml).
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
