[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[workspace.dependencies]
drive-proto = { path = "crates/drive-proto" }
drive-client = { path = "crates/drive-client" }
drive-dioxus = { path = "crates/drive-dioxus" }
drive-spine = { path = "crates/drive-spine" }
loro = "1.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
postcard = { version = "1", features = ["use-std"] }
dioxus = { version = "=0.8.0-alpha.3", features = ["router"] }

[profile.wasm-dev]
inherits = "dev"
opt-level = 1

[profile.server-dev]
inherits = "dev"

[profile.android-dev]
inherits = "dev"
