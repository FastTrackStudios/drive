{% extends "base.html" %}

{% block title %}{{ page.title }} · {{ config.title }}{% endblock title %}

{% block content %}
<h1 class="page-title">{{ page.title }}</h1>
{% if page.extra.tags %}
<p class="tags">{% for t in page.extra.tags %}<span class="tag">{{ t }}</span>{% endfor %}</p>
{% endif %}
<article class="prose">
    {{ page.content | safe }}
</article>
{% endblock content %}
